[package]
name = "martia-planner"
version = "1.8.0"
description = "MartiaPlanner — Student Study & Daily Activity Management App (Windows & Android)"
authors = ["MartiaPlanner Team"]
edition = "2021"

[lib]
name = "martia_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
