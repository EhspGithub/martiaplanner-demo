name: Build Windows (.exe / .msi) & Android (.apk) Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read App Version from package.json
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies & build dist
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Tauri CLI & build Windows (.exe / .msi)
        run: |
          npm install --legacy-peer-deps -D @tauri-apps/cli@^2.0.0
          npx tauri icon public/pwa-512x512.png
          npx tauri build

      - name: Prepare Versioned Windows Binaries
        shell: bash
        run: |
          mkdir -p release-dist
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            if [ -f "$f" ]; then cp "$f" "release-dist/MartiaPlanner-Windows-v${{ steps.pkg.outputs.version }}-Setup.exe"; fi
          done
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            if [ -f "$f" ]; then cp "$f" "release-dist/MartiaPlanner-Windows-v${{ steps.pkg.outputs.version }}.msi"; fi
          done
          if [ -f "src-tauri/target/release/martia-planner.exe" ]; then
            cp "src-tauri/target/release/martia-planner.exe" "release-dist/MartiaPlanner-Windows-v${{ steps.pkg.outputs.version }}.exe"
          fi

      - name: Upload Windows .exe & .msi Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MartiaPlanner-Windows-v${{ steps.pkg.outputs.version }}
          path: release-dist/*

      - name: Publish Windows Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "MartiaPlanner ${{ steps.pkg.outputs.tag }} — نسخه نصبی ویندوز (.exe) و اندروید (.apk)"
          body: |
            ### دانلود نسخه نصبی ویندوز و اندروید MartiaPlanner (${{ steps.pkg.outputs.tag }})
            - **فایل نصبی ویندوز (`.exe` / `.msi`):** `MartiaPlanner-Windows-${{ steps.pkg.outputs.tag }}-Setup.exe`
            - **فایل نصبی اندروید (`.apk`):** `MartiaPlanner-Android-${{ steps.pkg.outputs.tag }}.apk`
          files: release-dist/*

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read App Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies & build dist
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize & Build Tauri Android APK
        run: |
          npm install --legacy-peer-deps -D @tauri-apps/cli@^2.0.0
          npx tauri icon public/pwa-512x512.png
          npx tauri android init
          npx tauri android build --apk --target aarch64

      - name: Sign APK for direct phone installation
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$APK_PATH" aligned.apk || cp "$APK_PATH" aligned.apk
          keytool -genkey -v -keystore martia-release.keystore -alias martia -keyalg RSA -keysize 2048 -validity 10000 -storepass martia123 -keypass martia123 -dname "CN=MartiaPlanner, OU=Education, O=MartiaPlanner, L=Tehran, S=Tehran, C=IR"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks martia-release.keystore --ks-pass pass:martia123 --key-pass pass:martia123 --out MartiaPlanner-Android-${{ steps.pkg.outputs.tag }}.apk aligned.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MartiaPlanner-Android-${{ steps.pkg.outputs.tag }}
          path: MartiaPlanner-Android-${{ steps.pkg.outputs.tag }}.apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "MartiaPlanner ${{ steps.pkg.outputs.tag }} — نسخه نصبی ویندوز (.exe) و اندروید (.apk)"
          files: MartiaPlanner-Android-${{ steps.pkg.outputs.tag }}.apk
